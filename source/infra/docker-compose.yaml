version: "3.8"

# Local development environment for Notes Aggregator prototype.
# Usage:
#   docker compose up -d
#   sam local start-api --template template.yaml --env-vars env.local.json
#
# Endpoints:
#   OpenSearch:     http://localhost:9200
#   DynamoDB Local: http://localhost:8000
#   LocalStack S3:  http://localhost:4566

services:

  # ─────────────────────────────────────────────────────────
  # OpenSearch (single-node, security disabled for local dev)
  # ─────────────────────────────────────────────────────────
  opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: ncg-opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\\|yellow\"'"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────
  # DynamoDB Local (Idempotency store)
  # ─────────────────────────────────────────────────────────
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: ncg-dynamodb-local
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "8000:8000"

  # ─────────────────────────────────────────────────────────
  # LocalStack (Local S3 object store)
  # ─────────────────────────────────────────────────────────
  localstack:
    image: localstack/localstack:3.4
    container_name: ncg-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - DEFAULT_REGION=ap-south-1
      - AWS_DEFAULT_REGION=ap-south-1
    volumes:
      - localstack-data:/var/lib/localstack

  # ─────────────────────────────────────────────────────────
  # Bootstrap S3 bucket & DynamoDB table on startup
  # ─────────────────────────────────────────────────────────
  init-resources:
    image: amazon/aws-cli:latest
    container_name: ncg-init-resources
    depends_on:
      - localstack
      - dynamodb-local
    environment:
      - AWS_ACCESS_KEY_ID=mock
      - AWS_SECRET_ACCESS_KEY=mock
      - AWS_DEFAULT_REGION=ap-south-1
    entrypoint: >
      /bin/sh -c "
        sleep 3 &&
        aws --endpoint-url http://localstack:4566 s3 mb s3://clinical-notes-local || true &&
        aws --endpoint-url http://dynamodb-local:8000 dynamodb create-table \
          --table-name notes-idempotency-local \
          --attribute-definitions AttributeName=pk,AttributeType=S \
          --key-schema AttributeName=pk,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST || true &&
        echo 'LocalStack S3 bucket and DynamoDB table created successfully'
      "
    restart: "no"

volumes:
  opensearch-data:
  localstack-data:
